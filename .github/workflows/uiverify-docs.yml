name: UI Verify Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/thread/**"
      - "bun.lock"
      - ".github/workflows/uiverify-docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/thread/**"
      - "bun.lock"
      - ".github/workflows/uiverify-docs.yml"

permissions:
  contents: read

concurrency:
  group: uiverify-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uiverify-docs:
    name: uiverify-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Capture docs
        run: bun run test:visual:docs
      - name: Upload UI Verify build
        env:
          UIVERIFY_API_KEY: ${{ secrets.UIVERIFY_DOCS_API_KEY }}
        run: bun run uiverify:upload:docs
