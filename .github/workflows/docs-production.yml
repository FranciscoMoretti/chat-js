name: Docs Production

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".agents/skills/**"
      - "bun.lock"
      - "package.json"
      - "scripts/docs-production.mjs"
      - ".github/workflows/docs-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-production
  cancel-in-progress: true

# Vercel's Git integration deploys main automatically. This independent check
# fails if that build stays a preview or the public site's proxy serves old docs.
# Keep these paths aligned with docsInputs in scripts/docs-production.mjs.
jobs:
  verify:
    name: Verify production docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - name: Verify the public docs match the expected build
        run: bun scripts/docs-production.mjs verify
