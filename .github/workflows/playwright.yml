name: Playwright

on:
  pull_request:

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Playwright affected
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.affected.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check affected
        id: affected
        shell: bash
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "$TURBO_SCM_BASE...$TURBO_SCM_HEAD" -- .github/workflows/playwright.yml; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          TURBO_VERSION="$(node -p "require('./package.json').devDependencies.turbo")"
          if npx -y "turbo@${TURBO_VERSION}" query affected --tasks test:e2e --exit-code >/tmp/playwright-query.json 2>/tmp/playwright-query.log; then
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "run=true" >>"$GITHUB_OUTPUT"
            else
              cat /tmp/playwright-query.log
              cat /tmp/playwright-query.json
              exit "$status"
            fi
          fi

  playwright:
    name: Playwright
    needs: affected
    if: needs.affected.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Match the Playwright version in bun.lock. Includes Chromium, fonts, and OS libraries.
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
      options: --ipc=host
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chatjs_ci
          POSTGRES_USER: chatjs
          POSTGRES_PASSWORD: chatjs
        options: >-
          --health-cmd "pg_isready -U chatjs -d chatjs_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_PLAYWRIGHT: "true"
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      # The job container reaches its isolated PostgreSQL service at the service hostname.
      DATABASE_URL: postgres://chatjs:chatjs@postgres:5432/chatjs_ci
      WORKFLOW_POSTGRES_URL: postgres://chatjs:chatjs@postgres:5432/chatjs_ci
      EVE_ALLOW_REMOTE_DATABASE_TESTS: "true"
      EVE_TEST_DATABASE_URL: postgres://chatjs:chatjs@postgres:5432/chatjs_ci
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      EVE_GATEWAY_SECRET: playwright-isolated-eve-gateway-secret
      # Public test-only AES-256 key for the isolated MCP fixture.
      MCP_ENCRYPTION_KEY: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
      EVE_INTERNAL_ORIGIN: http://localhost:3000
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Bun
        # The browser image has no unzip for setup-bun.
        run: npm install --global bun@1.3.1 --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: ./.github/actions/cache-electron
      - run: bun install --frozen-lockfile
      - name: Verify the browser image matches Playwright
        working-directory: apps/chat
        run: |
          chromium="$(node -p 'require("playwright").chromium.executablePath()')"
          if [ ! -x "$chromium" ]; then
            echo "::error::Update the Playwright image in this workflow to match the browser version in bun.lock."
            exit 1
          fi
      - name: Check Playwright task isolation
        run: bun test scripts/playwright-task-graph.test.ts
      - name: Migrate isolated test database
        run: bun run --cwd apps/chat db:migrate
      - name: Bootstrap isolated EVE workflow database
        run: bun run --cwd apps/chat eve:setup
      - run: bunx turbo run test:e2e --filter=@chatjs/chat
      - name: Test conversation presentation
        working-directory: apps/chat
        run: bunx playwright test --config playwright.eve-presentation.config.ts
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-report
          path: |
            apps/chat/playwright-report/
            apps/chat/tests/eve-results/presentation/
          retention-days: 7
