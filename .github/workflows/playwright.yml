name: Playwright

on:
  pull_request:

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Playwright affected
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.affected.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check affected
        id: affected
        shell: bash
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "$TURBO_SCM_BASE...$TURBO_SCM_HEAD" -- .github/workflows/playwright.yml; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          TURBO_VERSION="$(node -p "require('./package.json').devDependencies.turbo")"
          if npx -y "turbo@${TURBO_VERSION}" query affected --tasks test:e2e --exit-code >/tmp/playwright-query.json 2>/tmp/playwright-query.log; then
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "run=true" >>"$GITHUB_OUTPUT"
            else
              cat /tmp/playwright-query.log
              cat /tmp/playwright-query.json
              exit "$status"
            fi
          fi

  playwright:
    name: Playwright
    needs: affected
    if: needs.affected.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        ports:
          - 127.0.0.1:55432:5432
        env:
          POSTGRES_DB: chatjs_ci
          POSTGRES_USER: chatjs
          POSTGRES_PASSWORD: chatjs
        options: >-
          --health-cmd "pg_isready -U chatjs -d chatjs_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_PLAYWRIGHT: "true"
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      DATABASE_URL: postgres://chatjs:chatjs@127.0.0.1:55432/chatjs_ci
      WORKFLOW_POSTGRES_URL: postgres://chatjs:chatjs@127.0.0.1:55432/chatjs_ci
      EVE_ALLOW_REMOTE_DATABASE_TESTS: "true"
      EVE_TEST_DATABASE_URL: postgres://chatjs:chatjs@127.0.0.1:55432/chatjs_ci
      EVE_GATEWAY_SECRET: playwright-isolated-eve-gateway-secret
      # Public test-only AES-256 key for the isolated MCP fixture.
      MCP_ENCRYPTION_KEY: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
      EVE_INTERNAL_ORIGIN: http://localhost:3000
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install Playwright workspace dependencies
        run: bun install --frozen-lockfile --filter './' --filter './apps/chat' --filter './packages/registry'
      - name: Install Chromium headless shell
        working-directory: apps/chat
        run: bun run playwright install --only-shell chromium
      - name: Check Playwright task isolation
        run: bun test scripts/playwright-task-graph.test.ts
      - name: Migrate isolated test database
        run: bun run --cwd apps/chat db:migrate
      - name: Bootstrap isolated EVE workflow database
        run: bun run --cwd apps/chat eve:setup
      - name: Test app routes
        working-directory: apps/chat
        env:
          PLAYWRIGHT: "True"
        run: bun run playwright test --config playwright.eve-ci-app.config.ts --workers=2 --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-report
          path: apps/chat/playwright-report/
          retention-days: 7

  fixtures:
    name: Playwright fixtures
    needs: affected
    if: needs.affected.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install Playwright workspace dependencies
        # The presentation fixtures load fonts from the registry workspace.
        run: bun install --frozen-lockfile --filter './' --filter './apps/chat' --filter './packages/registry'
      - name: Install Chromium headless shell
        working-directory: apps/chat
        run: bun run playwright install --only-shell chromium
      - name: Test standalone browser fixtures
        working-directory: apps/chat
        run: bun run playwright test --config playwright.eve-ci-fixtures.config.ts
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-fixture-results
          path: apps/chat/tests/eve-results/ci-fixtures/
          retention-days: 7
