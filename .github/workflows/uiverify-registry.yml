name: UI Verify Registry

# Broad path filter on purpose: the registry snapshots render against apps/chat
# (globals.css and the chat components the renderers import), so a change there
# can move a snapshot.
# The upload's `--only-changed` scopes the actual rendering to the tools the diff
# affects (via the archive's dependency graph), so the broad trigger stays cheap.
on:
  push:
    branches: [main]
    paths:
      - "packages/registry/**"
      - "packages/gateways/**"
      - "apps/chat/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/uiverify-registry.yml"
  pull_request:
    paths:
      - "packages/registry/**"
      - "packages/gateways/**"
      - "apps/chat/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/uiverify-registry.yml"

permissions:
  contents: read

concurrency:
  group: uiverify-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uiverify-registry:
    name: uiverify-registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps chromium
      # Always capture the full suite so the archive carries the complete
      # dependency graph (preview-stats.json). The upload runs with
      # `--only-changed`, which uses that graph to render only the stories whose
      # closure includes this commit's changed files (the graph traces into
      # apps/chat, so an app-side change still maps to the tools it renders) and
      # carries every untouched story's baseline forward. Capturing every tool is
      # cheap (seconds); the scoping happens server-side at upload.
      - name: Capture registry visual
        working-directory: packages/registry
        run: bun run test:visual
      # Pushes and pull requests from this repo's branches upload here, with the
      # key. A fork's pull request gets no secrets, so it saves the capture and
      # uiverify-upload.yml uploads it.
      - name: Upload UI Verify build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          UIVERIFY_API_KEY: ${{ secrets.UIVERIFY_REGISTRY_API_KEY }}
        # Merged UI becomes the baseline; PR builds still require review.
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bun run uiverify:upload:registry --auto-accept-changes
          else
            bun run uiverify:upload:registry
          fi
      - name: Save the capture
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uiverify-archive
          path: packages/registry/uiverify-archive/
          if-no-files-found: error
          retention-days: 7
