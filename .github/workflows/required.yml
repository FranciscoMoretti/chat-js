name: Required

on:
  pull_request:

jobs:
  gate:
    name: Required
    runs-on: ubuntu-22.04
    steps:
      - name: Wait for required workflows
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # ============================================
          # REQUIRED CHECKS - Add/remove check names here
          # ============================================
          check-regexp: ^(Docs|Lint|Typecheck|Unit|Playwright|CLI Scaffold|Native Lifecycle)$
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
      - name: Require native lifecycle acceptance
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: Native Lifecycle
          allowed-conclusions: success
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
