name: Required

on:
  pull_request:

concurrency:
  group: required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Required
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    steps:
      - name: Require latest workflow attempts
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            // A stack update can trigger two runs on the same head. Judge the
            // latest run and attempt, not cancelled checks from its predecessor.
            const required = [
              { file: "docs.yml", job: "Docs", allowSkipped: true },
              { file: "lint.yml", job: "Lint", allowSkipped: true },
              { file: "typecheck.yml", job: "Typecheck", allowSkipped: true },
              { file: "unit.yml", job: "Unit", allowSkipped: true },
              { file: "playwright.yml", job: "Playwright", allowSkipped: true },
              { file: "cli-scaffold.yml", job: "CLI Scaffold", allowSkipped: false },
              { file: "native.yml", job: "Native Lifecycle", allowSkipped: false },
            ];
            const latestRuns = async () => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo,
                head_sha: process.env.TARGET_SHA,
                event: "pull_request",
                per_page: 100,
              });
              return required.map(({ file }) => runs
                .filter((run) => run.path === `.github/workflows/${file}` &&
                  run.head_sha === process.env.TARGET_SHA &&
                  run.head_branch === process.env.TARGET_BRANCH)
                .sort((left, right) => right.id - left.id)[0]);
            };
            const deadline = Date.now() + 45 * 60 * 1000;
            while (Date.now() < deadline) {
              const runs = await latestRuns();
              if (runs.every((run) => run?.status === "completed")) {
                const results = await Promise.all(runs.map(async (run, index) => {
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                    ...context.repo,
                    run_id: run.id,
                    attempt_number: run.run_attempt,
                    per_page: 100,
                  });
                  const requirement = required[index];
                  const job = jobs.find((entry) => entry.name === requirement.job);
                  const allowed = (conclusion) => conclusion === "success" ||
                    (requirement.allowSkipped && conclusion === "skipped");
                  return {
                    passed: allowed(run.conclusion) && job?.status === "completed" && allowed(job.conclusion),
                    description: `${requirement.job}: run ${run.id}, attempt ${run.run_attempt}, workflow ${run.conclusion}, job ${job?.conclusion ?? "missing"}`,
                  };
                }));
                // A newer run or rerun can start while the job results are read.
                const current = await latestRuns();
                if (current.every((run, index) => run?.id === runs[index].id &&
                  run.run_attempt === runs[index].run_attempt && run.status === "completed")) {
                  for (const result of results) core.info(result.description);
                  const failures = results.filter((result) => !result.passed);
                  if (failures.length) core.setFailed(failures.map((result) => result.description).join("\n"));
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }
            core.setFailed("Timed out waiting for the latest required workflow attempts");
