name: CLI Scaffold

on:
  pull_request:
  # Run the full install/package compatibility check on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-scaffold-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Scaffold affected
    outputs:
      run: ${{ steps.affected.outputs.run }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check affected
        id: affected
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          TURBO_VERSION="$(node -p "require('./package.json').devDependencies.turbo")"
          if npx -y "turbo@${TURBO_VERSION}" query affected --tasks test:scaffold --packages @chat-js/cli --exit-code >/tmp/cli-scaffold-query.json 2>/tmp/cli-scaffold-query.log; then
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "run=true" >>"$GITHUB_OUTPUT"
            else
              cat /tmp/cli-scaffold-query.log
              cat /tmp/cli-scaffold-query.json
              exit "$status"
            fi
          fi

  prepare:
    name: Scaffold prepare
    needs: affected
    if: needs.affected.outputs.run == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build CLI and run shared unit tests
        run: bunx turbo run test:unit --filter=@chat-js/cli
      - name: Verify installed gateway contracts
        run: bun run --cwd packages/cli test:gateways
      - name: Pack prepared scaffold inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scaffold-prepared"
          bun pm --cwd packages/gateways pack --filename "$RUNNER_TEMP/scaffold-prepared/gateways.tgz"
          tar -czf "$RUNNER_TEMP/scaffold-prepared/workspace.tgz" packages/cli/dist packages/cli/templates packages/registry/dist
      - uses: actions/upload-artifact@v4
        with:
          name: scaffold-prepared
          path: ${{ runner.temp }}/scaffold-prepared/*.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  scaffold:
    name: Scaffold (${{ matrix.package-manager }}, electron=${{ matrix.electron }})
    needs: [affected, prepare]
    if: needs.affected.outputs.run == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        package-manager: [bun, npm, pnpm, yarn]
        electron: [false, true]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Enable Corepack
        run: corepack enable
      - name: Pin npm
        run: |
          # npm 10 crashes resolving vitest@^4 after Vitest 5 (npm/cli#9787)
          npm install --global npm@11
          npm --version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: scaffold-prepared
          path: ${{ runner.temp }}/scaffold-prepared
      - name: Restore prepared scaffold inputs
        run: tar -xzf "$RUNNER_TEMP/scaffold-prepared/workspace.tgz"
      - name: Test scaffold compatibility
        env:
          SCAFFOLD_PACKAGE_MANAGER: ${{ matrix.package-manager }}
          SCAFFOLD_ELECTRON: ${{ matrix.electron }}
        run: bash packages/cli/scripts/test-scaffold.sh "$SCAFFOLD_PACKAGE_MANAGER" "$SCAFFOLD_ELECTRON" "$RUNNER_TEMP/scaffold-prepared/gateways.tgz"

  cli-scaffold:
    name: CLI Scaffold
    needs: [affected, prepare, scaffold]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require all scaffold cases
        env:
          AFFECTED_RESULT: ${{ needs.affected.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SCAFFOLD_REQUIRED: ${{ needs.affected.outputs.run }}
          SCAFFOLD_RESULT: ${{ needs.scaffold.result }}
        run: |
          set -euo pipefail
          if [ "$AFFECTED_RESULT" != "success" ]; then
            echo "Affected check did not succeed: $AFFECTED_RESULT"
            exit 1
          fi
          case "$SCAFFOLD_REQUIRED:$PREPARE_RESULT:$SCAFFOLD_RESULT" in
            true:success:success|false:skipped:skipped) ;;
            *)
              echo "Scaffold cases did not succeed: $SCAFFOLD_REQUIRED:$PREPARE_RESULT:$SCAFFOLD_RESULT"
              exit 1
              ;;
          esac
