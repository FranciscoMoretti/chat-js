name: CLI Scaffold

on:
  pull_request:
  # Run the full install/package compatibility check on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-scaffold-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-scaffold:
    name: CLI Scaffold
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check affected
        id: affected
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          TURBO_VERSION="$(node -p "require('./package.json').devDependencies.turbo")"
          if npx -y "turbo@${TURBO_VERSION}" query affected --tasks test:scaffold --packages @chat-js/cli --exit-code >/tmp/cli-scaffold-query.json 2>/tmp/cli-scaffold-query.log; then
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "run=true" >>"$GITHUB_OUTPUT"
            else
              cat /tmp/cli-scaffold-query.log
              cat /tmp/cli-scaffold-query.json
              exit "$status"
            fi
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.affected.outputs.run == 'true'
        with:
          bun-version: 1.3.1
      - name: Enable Corepack
        if: steps.affected.outputs.run == 'true'
        run: corepack enable
      - name: Pin npm
        if: steps.affected.outputs.run == 'true'
        run: |
          # npm 10 crashes resolving vitest@^4 after Vitest 5 (npm/cli#9787)
          npm install --global npm@11
          npm --version
      - uses: actions/cache@v4
        if: steps.affected.outputs.run == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - if: steps.affected.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Test scaffold compatibility
        if: steps.affected.outputs.run == 'true'
        run: bunx turbo run test:scaffold --filter=@chat-js/cli
