name: UI Verify Create

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "apps/chat/components/part/**"
      - "packages/thread/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/uiverify-create.yml"
  pull_request:
    paths:
      - "apps/site/**"
      - "apps/chat/components/part/**"
      - "packages/thread/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/uiverify-create.yml"

permissions:
  contents: read

concurrency:
  group: uiverify-create-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uiverify-create:
    name: uiverify-create
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CREATE_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: bun --filter @chat-js/thread build
      - name: Capture Create with both primitive libraries
        run: |
          set -euo pipefail
          PORT=3000 bun --filter @chatjs/site dev > "$RUNNER_TEMP/create-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 60 --retry-delay 2 --retry-connrefused http://localhost:3000/create > /dev/null
          bunx playwright test --config apps/site/tests/create.playwright.config.mts
          bun -e 'import { finalizeArchive } from "@uiverify/playwright"; finalizeArchive("apps/site/uiverify-archive");'
      - name: Upload UI Verify build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          UIVERIFY_API_KEY: ${{ secrets.UIVERIFY_CREATE_API_KEY }}
        run: bunx uiverify upload --static-dir apps/site/uiverify-archive
      - name: Save the capture
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uiverify-archive
          path: apps/site/uiverify-archive/
          if-no-files-found: error
          retention-days: 7
