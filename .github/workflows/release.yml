name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Update npm for trusted publishing
        run: |
          npm install --global npm@latest --prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # Tokens cannot publish these packages. release.yml must be a trusted
      # publisher on both @chat-js/registry and chat-js. Run this before
      # Changesets: that action rewrites the registry prerelease to the next
      # stable version in the worktree, and this step must publish the commit
      # on main. Remove this step after 0.2.0-beta.3 and 1.0.0-alpha.1 are on npm.
      - name: Publish matched gateway registry and CLI
        id: gateway-publish
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          export PATH="$HOME/.npm-global/bin:$PATH"
          echo "npm $(npm --version) ($(command -v npm))"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC token endpoint is missing; trusted publishing cannot sign in."
            exit 1
          fi

          require_trusted_publisher() {
            local name="$1"
            local id_json token encoded body_file status message
            id_json="$(curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              -H "Accept: application/json" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
            token="$(printf '%s' "$id_json" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const v=JSON.parse(s).value; if(!v) process.exit(1); process.stdout.write(v)})')"
            encoded="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$name")"
            body_file="$(mktemp)"
            status="$(curl -sS -o "$body_file" -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encoded}")"
            message="$(node -e 'const fs=require("fs"); const raw=fs.readFileSync(process.argv[1],"utf8"); let parsed; try { parsed=JSON.parse(raw) } catch { parsed=null } if (parsed && parsed.token) { console.log("ok"); return } const detail=parsed?.message || parsed?.error || raw; console.log(String(detail).slice(0,300))' "$body_file")"
            rm -f "$body_file"
            unset token id_json
            if [ "$status" != "200" ] && [ "$status" != "201" ]; then
              echo "::error::npm refused the GitHub OIDC token for ${name} (HTTP ${status}): ${message}"
              exit 1
            fi
            echo "npm trusted publisher accepted ${name}"
          }

          require_trusted_publisher @chat-js/registry
          require_trusted_publisher chat-js

          publish_exact() {
            local workspace_dir="$1"
            local expected="$2"
            local name version tag lookup
            name="$(node -p "require('./${workspace_dir}/package.json').name")"
            version="$(node -p "require('./${workspace_dir}/package.json').version")"
            tag="$(node -p "require('./${workspace_dir}/package.json').publishConfig?.tag ?? 'latest'")"
            if [ "${version}" != "${expected}" ]; then
              echo "Skipping ${name}; version is ${version}, not ${expected}"
              return 0
            fi
            if lookup="$(npm view "${name}@${version}" version --json 2>&1)"; then
              echo "${name}@${version} already on npm"
            elif printf '%s' "$lookup" | grep -q 'E404'; then
              echo "Publishing ${name}@${version} on tag ${tag}"
              (cd "${workspace_dir}" && npm publish --access public --tag "${tag}")
            else
              echo "::error::Could not query npm for ${name}@${version}; refusing to treat a registry/authentication failure as a missing version."
              printf '%s\n' "$lookup"
              return 1
            fi
          }

          publish_exact packages/registry 0.2.0-beta.3
          publish_exact packages/cli 1.0.0-alpha.1
          if [ "$(node -p "require('./packages/cli/package.json').version")" = "1.0.0-alpha.1" ]; then
            npm dist-tag add chat-js@1.0.0-alpha.1 latest
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        if: always() && steps.gateway-publish.outcome != 'cancelled'
        uses: changesets/action@v1
        with:
          publish: bun run release
          title: "chore: version releases"
          commit: "chore: version releases"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # Configure chat-js on npm to trust this repository and release.yml.
      # Trusted publishing cannot create a package's first version. Use the
      # classic token for unpublished packages so a partial publish cannot leave
      # @chat-js/thread (or similar first releases) off npm. Do not publish
      # the old version while Changesets is still preparing a version PR.
      - name: Publish first-time packages
        if: always() && steps.changesets.outputs.hasChangesets == 'false' && (steps.changesets.outcome == 'success' || steps.changesets.outcome == 'failure')
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"

          publish_if_missing() {
            local workspace_dir="$1"
            local name version tag
            name="$(node -p "require('./${workspace_dir}/package.json').name")"
            version="$(node -p "require('./${workspace_dir}/package.json').version")"
            tag="${name}@${version}"
            if [[ "${version%%+*}" == *-* ]]; then
              echo "::error::Publish audited prereleases explicitly with their prerelease tag; the stable fallback cannot publish ${tag}."
              return 1
            fi

            local lookup
            if lookup="$(npm view "${name}@${version}" version --json)"; then
              echo "${tag} already on npm"
            else
              # Only a genuine missing version should trigger publication.
              if ! printf '%s' "$lookup" | node -e '
                let input = "";
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => {
                  try { process.exit(JSON.parse(input).error?.code === "E404" ? 0 : 1); }
                  catch { process.exit(1); }
                });
              '; then
                echo "::error::Could not query npm for ${tag}; refusing to treat a registry/authentication failure as a missing version."
                return 1
              fi

              echo "Publishing ${tag} (first publish cannot use OIDC)"
              bun --filter "${name}" build
              if ! npm publish --workspace "${name}" --access public --no-provenance; then
                echo "::error::Could not publish ${tag}. Create it once locally with 2FA (npm publish --access public --no-provenance in ${workspace_dir}), then add GitHub Actions as a trusted publisher on npmjs.com."
                return 1
              fi

              if [ "$(npm view "${tag}" version)" != "$version" ]; then
                echo "::error::Published version ${tag} could not be verified on npm."
                return 1
              fi
            fi

            if git rev-parse "${tag}" >/dev/null 2>&1; then
              echo "tag ${tag} already exists"
            else
              git tag "${tag}"
            fi
            git push origin "${tag}"

            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "GitHub release ${tag} already exists"
            else
              gh release create "${tag}" --title "${tag}" --notes-file "${workspace_dir}/CHANGELOG.md"
            fi
          }

          publish_if_missing packages/thread
